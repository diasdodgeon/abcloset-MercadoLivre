<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° com Vídeo Animado (Mundo Vivo)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let cena, camera, renderizador, esfera;
        let arrastando = false, noMouseX = 0, noMouseY = 0;
        let lon = 0, lat = 0, lonAlvo = 0, latAlvo = 0;
        let phi = 0, theta = 0;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            cena = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

            // 1. Carrega o fundo panorâmico estático
            const carregador = new THREE.TextureLoader();
            carregador.load('./360.png', function (textura) {
                textura.mapping = THREE.EquirectangularReflectionMapping;
                const geometria = new THREE.SphereGeometry(500, 60, 40);
                geometria.scale(-1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ map: textura });
                esfera = new THREE.Mesh(geometria, material);
                cena.add(esfera);

                // Adiciona o elemento de vídeo animado após carregar o cenário
                adicionarElementoAnimado();
            });

            renderizador = new THREE.WebGLRenderer({ antialias: true });
            renderizador.setPixelRatio(window.devicePixelRatio);
            renderizador.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderizador.domElement);

            document.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            window.addEventListener('resize', onWindowResize);
        }

        // 2. Criar e posicionar o vídeo WebM na cena 3D
        // 1. Função de criação do vídeo com tratamento de erro e flags de alta performance
function adicionarElementoAnimado() {
    const video = document.createElement('video');
    video.src = './animacao.webm';
    video.crossOrigin = 'anonymous';
    video.loop = true;
    video.muted = true;
    video.playsInline = true;

    // Tratamento de erro para evitar falhas do Service Worker (sw.js)
    video.onerror = function() {
        console.error("Erro ao carregar o arquivo de vídeo. Verifique o caminho ou permissões CORS.");
    };

    video.play().catch(err => console.warn("Autoplay bloqueado pelo navegador:", err));

    const texturaVideo = new THREE.VideoTexture(video);
    texturaVideo.format = THREE.RGBAFormat;
    texturaVideo.minFilter = THREE.LinearFilter;
    texturaVideo.magFilter = THREE.LinearFilter;
    texturaVideo.generateMipmaps = false; // DESATIVAR MIPMAPS ECONOMIZA MUITA MEMÓRIA EM VÍDEOS

    const planoGeometria = new THREE.PlaneGeometry(100, 100);

    const planoMaterial = new THREE.MeshBasicMaterial({
        map: texturaVideo,
        transparent: true,
        alphaTest: 0.05,
        depthWrite: false,
        side: THREE.DoubleSide
    });

    const meshVideo = new THREE.Mesh(planoGeometria, planoMaterial);
    meshVideo.position.set(150, 0, -300);
    meshVideo.lookAt(camera.position);

    cena.add(meshVideo);
}

// 2. Configurações de performance no Init
function init() {
    const container = document.getElementById('canvas-container');

    cena = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

    // Otimização: Reduzido o número de segmentos da esfera de (60, 40) para (32, 32)
    // Isso reduz significativamente o uso de memória e vértices sem perder qualidade visual.
    const carregador = new THREE.TextureLoader();
    carregador.load('./360.png', function (textura) {
        textura.mapping = THREE.EquirectangularReflectionMapping;
        const geometria = new THREE.SphereGeometry(500, 32, 32); 
        geometria.scale(-1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ map: textura });
        esfera = new THREE.Mesh(geometria, material);
        cena.add(esfera);

        adicionarElementoAnimado();
    });

    // Otimização do Renderizador WebGL
    renderizador = new THREE.WebGLRenderer({ 
        antialias: false,             // Desativar Antialias se o desempenho for crítico
        powerPreference: "high-performance" // Solicita à GPU dedicada prioridade de alto desempenho
    });
    renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limita o pixel ratio a 2x no máximo
    renderizador.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderizador.domElement);

    // Eventos...
    document.addEventListener('mousedown', onPointerDown);
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('mouseup', onPointerUp);
    window.addEventListener('resize', onWindowResize);
}
        // --- Controles padrão de rotação e animação ---
        function onPointerDown(event) {
            arrastando = true;
            noMouseX = event.clientX;
            noMouseY = event.clientY;
        }

        function onPointerMove(event) {
            if (arrastando) {
                lonAlvo += (noMouseX - event.clientX) * 0.1;
                latAlvo += (event.clientY - noMouseY) * 0.1;
                noMouseX = event.clientX;
                noMouseY = event.clientY;
            }
        }

        function onPointerUp() { arrastando = false; }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
        }

        function update() {
            if (!arrastando) lonAlvo += 0.03;

            latAlvo = Math.max(-85, Math.min(85, latAlvo));
            lon += (lonAlvo - lon) * 0.1;
            lat += (latAlvo - lat) * 0.1;

            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const vetorAlvo = new THREE.Vector3();
            vetorAlvo.x = 500 * Math.sin(phi) * Math.sin(theta);
            vetorAlvo.y = 500 * Math.cos(phi);
            vetorAlvo.z = 500 * Math.sin(phi) * Math.cos(theta);

            camera.lookAt(vetorAlvo);
            renderizador.render(cena, camera);
        }
    </script>
</body>
</html>
