<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° com Controles GUI em Tempo Real</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Biblioteca para o Painel de Controles (lil-gui) -->
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let cena, camera, renderizador, esfera, meshVideo;
        let arrastando = false, noMouseX = 0, noMouseY = 0;
        let lon = 0, lat = 0, lonAlvo = 0, latAlvo = 0;
        let phi = 0, theta = 0;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            cena = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

            const carregador = new THREE.TextureLoader();
            carregador.load('./360.png', function (textura) {
                textura.mapping = THREE.EquirectangularReflectionMapping;
                const geometria = new THREE.SphereGeometry(500, 32, 32); 
                geometria.scale(-1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ map: textura });
                esfera = new THREE.Mesh(geometria, material);
                cena.add(esfera);

                adicionarElementoAnimado();
            });

            renderizador = new THREE.WebGLRenderer({ antialias: false });
            renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderizador.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderizador.domElement);

            document.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            window.addEventListener('resize', onWindowResize);
        }

        function adicionarElementoAnimado() {
            const video = document.createElement('video');
            video.src = './animacao.webm';
            video.crossOrigin = 'anonymous';
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            video.play().catch(err => console.warn(err));

            const texturaVideo = new THREE.VideoTexture(video);
            texturaVideo.format = THREE.RGBAFormat;

            const planoGeometria = new THREE.PlaneGeometry(100, 100);
            const planoMaterial = new THREE.MeshBasicMaterial({
                map: texturaVideo,
                transparent: true,
                alphaTest: 0.05,
                depthWrite: false,
                side: THREE.DoubleSide
            });

            meshVideo = new THREE.Mesh(planoGeometria, planoMaterial);
            meshVideo.position.set(150, 0, -300);

            cena.add(meshVideo);

            // CRIA OS CONTROLES PAINEL GUI
            criarPainelControle();
        }

        // --- PAINEL DE CONTROLES EM TEMPO REAL ---
        function criarPainelControle() {
            const gui = new lil.GUI({ title: 'Ajuste do Vídeo' });

            // Objeto auxiliar para controlar a escala proporcional
            const configuracoes = {
                escala: 1,
                imprimirValores: function() {
                    console.log(`Posição Final -> X: ${meshVideo.position.x}, Y: ${meshVideo.position.y}, Z: ${meshVideo.position.z}`);
                    console.log(`Escala Final -> ${meshVideo.scale.x}`);
                    alert(`Copie do Console (F12):\nposition.set(${meshVideo.position.x}, ${meshVideo.position.y}, ${meshVideo.position.z})\nscale: ${meshVideo.scale.x}`);
                }
            };

            // Controles de Posição (Min, Max, Passo)
            const pastaPosicao = gui.addFolder('Posição 3D');
            pastaPosicao.add(meshVideo.position, 'x', -500, 500, 1).name('Posição X (Esq/Dir)');
            pastaPosicao.add(meshVideo.position, 'y', -500, 500, 1).name('Posição Y (Cima/Baixo)');
            pastaPosicao.add(meshVideo.position, 'z', -500, 500, 1).name('Posição Z (Frente/Trás)');

            // Controle de Tamanho (Escala)
            const pastaTamanho = gui.addFolder('Tamanho');
            pastaTamanho.add(configuracoes, 'escala', 0.1, 5, 0.1).name('Tamanho (Escala)').onChange(v => {
                meshVideo.scale.set(v, v, v);
            });

            // Botão para exibir o código final pronto
            gui.add(configuracoes, 'imprimirValores').name('📋 Copiar Coordenadas');
        }

        // Controles de rotação e animação padrão
        function onPointerDown(event) { arrastando = true; noMouseX = event.clientX; noMouseY = event.clientY; }
        function onPointerMove(event) {
            if (arrastando) {
                lonAlvo += (noMouseX - event.clientX) * 0.1;
                latAlvo += (event.clientY - noMouseY) * 0.1;
                noMouseX = event.clientX; noMouseY = event.clientY;
            }
        }
        function onPointerUp() { arrastando = false; }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
        }

        function update() {
            if (!arrastando) lonAlvo += 0.03;

            latAlvo = Math.max(-85, Math.min(85, latAlvo));
            lon += (lonAlvo - lon) * 0.1;
            lat += (latAlvo - lat) * 0.1;

            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const vetorAlvo = new THREE.Vector3();
            vetorAlvo.x = 500 * Math.sin(phi) * Math.sin(theta);
            vetorAlvo.y = 500 * Math.cos(phi);
            vetorAlvo.z = 500 * Math.sin(phi) * Math.cos(theta);

            camera.lookAt(vetorAlvo);

            if (meshVideo) meshVideo.lookAt(camera.position);

            renderizador.render(cena, camera);
        }
    </script>
</body>
</html>
