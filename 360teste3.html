<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° com Vídeos + Áudio Espacial Externo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #btn-audio {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 1px solid #fff;
            border-radius: 5px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="btn-audio">🔊 Ativar Sons do Cenário</button>
    <div id="canvas-container"></div>

    <script>
        let cena, camera, renderizador, esfera;
        let listenerAudio;
        let elementosVideo = [];
        let sonsPosicionais = []; // Guarda as referências dos áudios para dar .play() depois
        
        let arrastando = false, noMouseX = 0, noMouseY = 0;
        let lon = 0, lat = 0, lonAlvo = 0, latAlvo = 0;
        let phi = 0, theta = 0;

        // 1. ADICIONE O CAMINHO DO ÁUDIO INDIVIDUAL PARA CADA VÍDEO
        const listaDeVideos = [
            {
                src: './animacao.webm',
                audioSrc: './garota.mp3', // Arquivo de áudio externo
                largura: 100,
                altura: 100,
                posicao: { x: 150, y: 0, z: -300 },
                refDistance: 120
            }
           // adicionar aqui outros elementos de video
           //...  ...   ...
        ];

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            cena = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

            // Configura o ouvinte na câmera
            listenerAudio = new THREE.AudioListener();
            camera.add(listenerAudio);

            const carregador = new THREE.TextureLoader();
            carregador.load('./estrada.png', function (textura) {
                textura.mapping = THREE.EquirectangularReflectionMapping;
                const geometria = new THREE.SphereGeometry(500, 32, 32); 
                geometria.scale(-1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ map: textura });
                esfera = new THREE.Mesh(geometria, material);
                cena.add(esfera);

                adicionarElementosAnimados();
            });

            renderizador = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderizador.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderizador.domElement);

            // Eventos de entrada
            document.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            window.addEventListener('resize', onWindowResize);

            document.addEventListener('touchstart', onPointerDown, { passive: true });
            document.addEventListener('touchmove', onPointerMove, { passive: true });
            document.addEventListener('touchend', onPointerUp);

            document.getElementById('btn-audio').addEventListener('click', ativarAudioNavegador);
        }

        let audioAtivadoPeloUsuario = false;

        function adicionarElementosAnimados() {
            const carregadorAudio = new THREE.AudioLoader();

            listaDeVideos.forEach(config => {
                // Vídeo mudo (apenas para textura)
                const video = document.createElement('video');
                video.src = config.src;
                video.crossOrigin = 'anonymous';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.play().catch(err => console.warn("Erro ao iniciar vídeo:", err));

                const texturaVideo = new THREE.VideoTexture(video);
                texturaVideo.format = THREE.RGBAFormat;
                texturaVideo.generateMipmaps = false;

                const planoGeometria = new THREE.PlaneGeometry(config.largura, config.altura);
                const planoMaterial = new THREE.MeshBasicMaterial({
                    map: texturaVideo,
                    transparent: true,
                    alphaTest: 0.05,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });

                const meshVideo = new THREE.Mesh(planoGeometria, planoMaterial);
                meshVideo.position.set(config.posicao.x, config.posicao.y, config.posicao.z);

                // Áudio Posicional 3D
                const somPosicional = new THREE.PositionalAudio(listenerAudio);

                carregadorAudio.load(
                    config.audioSrc, 
                    function(buffer) {
                        somPosicional.setBuffer(buffer);
                        somPosicional.setLoop(true);
                        
                        // Configurações de alcance ajustadas para a escala do seu cenário:
                        somPosicional.setRefDistance(200);   // Distância onde o som toca a 100% do volume
                        somPosicional.setMaxDistance(1200);  // Distância máxima onde o som para de ser ouvido
                        somPosicional.setRolloffFactor(1);   // Suavidade da queda do volume

                        // Se o usuário já clicou no botão enquanto o áudio baixava, toca imediatamente
                        if (audioAtivadoPeloUsuario && !somPosicional.isPlaying) {
                            somPosicional.play();
                        }
                    },
                    undefined,
                    function(err) {
                        console.error("Erro ao carregar o arquivo de áudio:", config.audioSrc, err);
                    }
                );

                meshVideo.add(somPosicional);
                sonsPosicionais.push(somPosicional);

                cena.add(meshVideo);
                elementosVideo.push(meshVideo);
            });
        }

        function ativarAudioNavegador() {
            audioAtivadoPeloUsuario = true;

            // Desbloqueia o contexto de áudio do navegador
            if (listenerAudio.context.state === 'suspended') {
                listenerAudio.context.resume();
            }

            // Toca todos os áudios que já foram carregados
            sonsPosicionais.forEach(som => {
                if (som.buffer && !som.isPlaying) {
                    som.play();
                }
            });

        document.getElementById('btn-audio').style.display ='none';
        }

        // Interação e renderização padrão
        function obterPosicao(event) {
            if (event.touches && event.touches.length > 0) {
                return { x: event.touches[0].clientX, y: event.touches[0].clientY };
            }
            return { x: event.clientX, y: event.clientY };
        }

        function onPointerDown(event) {
            arrastando = true;
            const pos = obterPosicao(event);
            noMouseX = pos.x;
            noMouseY = pos.y;
        }

        function onPointerMove(event) {
            if (arrastando) {
                const pos = obterPosicao(event);
                lonAlvo += (noMouseX - pos.x) * 0.1;
                latAlvo += (pos.y - noMouseY) * 0.1;
                noMouseX = pos.x;
                noMouseY = pos.y;
            }
        }

        function onPointerUp() { arrastando = false; }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
        }

        function update() {
            if (!arrastando) lonAlvo += 0.03;

            latAlvo = Math.max(-85, Math.min(85, latAlvo));
            lon += (lonAlvo - lon) * 0.1;
            lat += (latAlvo - lat) * 0.1;

            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const vetorAlvo = new THREE.Vector3();
            vetorAlvo.x = 500 * Math.sin(phi) * Math.sin(theta);
            vetorAlvo.y = 500 * Math.cos(phi);
            vetorAlvo.z = 500 * Math.sin(phi) * Math.cos(theta);

            camera.lookAt(vetorAlvo);

            elementosVideo.forEach(mesh => {
                mesh.lookAt(camera.position);
            });

            renderizador.render(cena, camera);
        }
    </script>
</body>
</html>
