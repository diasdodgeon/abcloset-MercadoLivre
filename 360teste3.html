<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° com Vídeos Clicáveis e Áudio Posicional</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            cursor: pointer; 
            touch-action: none; /* Evita gestos padrão de scroll do navegador em mobile */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let cena, camera, renderizador, esfera;
        let listenerAudio;
        let elementosVideo = [];
        
        // Raycaster para interações de clique
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Controle de rotação automática
        let rotacaoAtiva = true; // Permanece true até o primeiro toque/clique

        // Controle de ponteiro e rotação manual
        let arrastando = false;
        let noMouseX = 0, noMouseY = 0;
        let inicioCliqueX = 0, inicioCliqueY = 0;
        let lon = 0, lat = 0, lonAlvo = 0, latAlvo = 0;
        let phi = 0, theta = 0;

        const listaDeVideos = [
            {
                src: './animacao.webm',
                audioSrc: './garota.mp3',
                largura: 100,
                altura: 100,
                posicao: { x: 150, y: 0, z: -300 }
            }
        ];

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            cena = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

            listenerAudio = new THREE.AudioListener();
            camera.add(listenerAudio);

            const carregador = new THREE.TextureLoader();
            carregador.load('./bosque.png', function (textura) {
                textura.mapping = THREE.EquirectangularReflectionMapping;
                const geometria = new THREE.SphereGeometry(500, 32, 32); 
                geometria.scale(-1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ map: textura });
                esfera = new THREE.Mesh(geometria, material);
                cena.add(esfera);

                adicionarElementosAnimados();
            });

            renderizador = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderizador.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderizador.domElement);

            registrarEventosPonteiro();
            window.addEventListener('resize', onWindowResize);
        }

        function registrarEventosPonteiro() {
            const container = document.getElementById('canvas-container');

            container.addEventListener('pointerdown', onPointerDown);
            container.addEventListener('pointermove', onPointerMove);
            container.addEventListener('pointerup', onPointerUp);
            container.addEventListener('pointercancel', onPointerUp);
        }

        function adicionarElementosAnimados() {
            const carregadorAudio = new THREE.AudioLoader();

            listaDeVideos.forEach(config => {
                const video = document.createElement('video');
                video.src = config.src;
                video.crossOrigin = 'anonymous';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.play().catch(err => console.warn("Erro ao iniciar vídeo:", err));

                const texturaVideo = new THREE.VideoTexture(video);
                texturaVideo.format = THREE.RGBAFormat;
                texturaVideo.generateMipmaps = false;

                const planoGeometria = new THREE.PlaneGeometry(config.largura, config.altura);
                const planoMaterial = new THREE.MeshBasicMaterial({
                    map: texturaVideo,
                    transparent: true,
                    alphaTest: 0.05,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });

                const meshVideo = new THREE.Mesh(planoGeometria, planoMaterial);
                meshVideo.position.set(config.posicao.x, config.posicao.y, config.posicao.z);

                const somPosicional = new THREE.PositionalAudio(listenerAudio);

                carregadorAudio.load(config.audioSrc, function(buffer) {
                    somPosicional.setBuffer(buffer);
                    somPosicional.setLoop(true);
                    somPosicional.setRefDistance(200);
                    somPosicional.setMaxDistance(1200);
                    somPosicional.setRolloffFactor(1);
                });

                meshVideo.add(somPosicional);
                meshVideo.userData = { som: somPosicional };

                cena.add(meshVideo);
                elementosVideo.push(meshVideo);
            });
        }

        function detectarCliqueNoVideo(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const intersecoes = raycaster.intersectObjects(elementosVideo);

            if (intersecoes.length > 0) {
                const objetoClicado = intersecoes[0].object;
                const som = objetoClicado.userData.som;

                if (listenerAudio.context.state === 'suspended') {
                    listenerAudio.context.resume();
                }

                if (som && som.buffer) {
                    if (som.isPlaying) {
                        som.pause();
                    } else {
                        som.play();
                    }
                }
            }
        }

        function onPointerDown(event) {
            // Desativa permanentemente a rotação automática no primeiro toque/clique
            rotacaoAtiva = false;

            arrastando = true;
            noMouseX = event.clientX;
            noMouseY = event.clientY;

            inicioCliqueX = event.clientX;
            inicioCliqueY = event.clientY;
        }

        function onPointerMove(event) {
            if (!arrastando) return;

            const deltaX = event.clientX - noMouseX;
            const deltaY = event.clientY - noMouseY;

            const sensibilidade = 0.25;

            lonAlvo -= deltaX * sensibilidade;
            latAlvo += deltaY * sensibilidade;

            noMouseX = event.clientX;
            noMouseY = event.clientY;
        }

        function onPointerUp(event) {
            if (!arrastando) return;
            arrastando = false;

            const distanciaMovidaX = Math.abs(event.clientX - inicioCliqueX);
            const distanciaMovidaY = Math.abs(event.clientY - inicioCliqueY);

            if (distanciaMovidaX < 8 && distanciaMovidaY < 8) {
                detectarCliqueNoVideo(event);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
        }

        function update() {
            // A rotação automática só ocorre enquanto rotacaoAtiva for true
            if (rotacaoAtiva) {
                lonAlvo += 0.03;
            }

            latAlvo = Math.max(-85, Math.min(85, latAlvo));
            lon += (lonAlvo - lon) * 0.1;
            lat += (latAlvo - lat) * 0.1;

            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const vetorAlvo = new THREE.Vector3();
            vetorAlvo.x = 500 * Math.sin(phi) * Math.sin(theta);
            vetorAlvo.y = 500 * Math.cos(phi);
            vetorAlvo.z = 500 * Math.sin(phi) * Math.cos(theta);

            camera.lookAt(vetorAlvo);

            elementosVideo.forEach(mesh => {
                mesh.lookAt(camera.position);
            });

            renderizador.render(cena, camera);
        }
    </script>
</body>
</html>
