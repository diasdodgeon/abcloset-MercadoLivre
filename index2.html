<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cinema Local</title>
    <style>
        body { font-family: Arial, sans-serif; background: #141414; color: white; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        video { width: 100%; max-height: 450px; background: black; margin-top: 20px; border-radius: 8px; }
        .btn-upload { background: #E50914; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        #fileInput { display: none; }
        .lista-filmes { margin-top: 30px; text-align: left; background: #222; padding: 15px; border-radius: 8px; }
        .filme-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; }
        .filme-item:hover { background: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Meus Filmes Salvos</h1>
    
    <label for="fileInput" class="btn-upload">Adicionar Filme do Celular</label>
    <input type="file" id="fileInput" accept="video/*" multiple>

    <video id="videoPlayer" controls></video>

    <div class="lista-filmes">
        <h3>Sua Biblioteca:</h3>
        <div id="lista">Nenhum filme adicionado ainda.</div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const videoPlayer = document.getElementById('videoPlayer');
    const listaDiv = document.getElementById('lista');

    // Banco de dados IndexedDB para persistir os arquivos de vídeo no cache do navegador
    let db;
    const request = indexedDB.open("CinemaLocalDB", 1);

    request.onupgradeneeded = function(e) {
        db = e.target.result;
        db.createObjectStore("filmes", { keyPath: "nome" });
    };

    request.onsuccess = function(e) {
        db = e.target.result;
        carregarFilmes();
    };

    // Ouvinte para quando o usuário escolhe filmes do celular
    fileInput.addEventListener('change', function(e) {
        const files = e.target.files;
        for (let file of files) {
            const tx = db.transaction("filmes", "readwrite");
            const store = tx.objectStore("filmes");
            store.put({ nome: file.name, arquivo: file });
        }
        setTimeout(carregarFilmes, 500); // Atualiza a lista na tela
    });

    // Função que busca os filmes salvos no cache e exibe na tela
    function carregarFilmes() {
        const tx = db.transaction("filmes", "readonly");
        const store = tx.objectStore("filmes");
        const requestAll = store.getAll();

        requestAll.onsuccess = function() {
            const filmes = requestAll.result;
            if (filmes.length === 0) {
                listaDiv.innerHTML = "Nenhum filme adicionado ainda.";
                return;
            }
            
            listaDiv.innerHTML = "";
            filmes.forEach(filme => {
                const item = document.createElement('div');
                item.className = 'filme-item';
                item.innerText = filme.nome;
                item.onclick = function() {
                    reproduzirFilme(filme.arquivo);
                };
                listaDiv.appendChild(item);
            });
        };
    }

    // Função que carrega o filme escolhido no player de vídeo
    function reproduzirFilme(fileBlob) {
        const videoURL = URL.createObjectURL(fileBlob);
        videoPlayer.src = videoURL;
        videoPlayer.play();
    }
</script>

</body>
</html>
