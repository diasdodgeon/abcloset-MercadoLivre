<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 360° Avançado</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let cena, camera, renderizador, esfera;
        let arrastando = false, noMouseX = 0, noMouseY = 0;
        let lon = 0, lat = 0, lonAlvo = 0, latAlvo = 0;
        let phi = 0, theta = 0;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            cena = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

            const carregador = new THREE.TextureLoader();
            const urlDaImagem = './360.png';

            carregador.load(urlDaImagem, function (textura) {
                textura.mapping = THREE.EquirectangularReflectionMapping;
                const geometria = new THREE.SphereGeometry(500, 60, 40);
                geometria.scale(-1, 1, 1);

                const material = new THREE.MeshBasicMaterial({ map: textura });
                esfera = new THREE.Mesh(geometria, material);
                cena.add(esfera);
            });

            renderizador = new THREE.WebGLRenderer({ antialias: true });
            renderizador.setPixelRatio(window.devicePixelRatio);
            renderizador.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderizador.domElement);

            // Eventos de Mouse e Toque
            document.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            document.addEventListener('wheel', onDocumentMouseWheel, { passive: false });

            // Suporte Touch para Mobile
            document.addEventListener('touchstart', onPointerDown);
            document.addEventListener('touchmove', onPointerMove);
            document.addEventListener('touchend', onPointerUp);

            window.addEventListener('resize', onWindowResize);
        }

        function getClientPos(event) {
            if (event.touches && event.touches.length > 0) {
                return { x: event.touches[0].clientX, y: event.touches[0].clientY };
            }
            return { x: event.clientX, y: event.clientY };
        }

        function onPointerDown(event) {
            arrastando = true;
            const pos = getClientPos(event);
            noMouseX = pos.x;
            noMouseY = pos.y;
        }

        function onPointerMove(event) {
            if (arrastando) {
                const pos = getClientPos(event);
                lonAlvo += (noMouseX - pos.x) * 0.1;
                latAlvo += (pos.y - noMouseY) * 0.1;
                noMouseX = pos.x;
                noMouseY = pos.y;
            }
        }

        function onPointerUp() {
            arrastando = false;
        }

        // 1. Funcionalidade de Zoom via Scroll
        function onDocumentMouseWheel(event) {
            event.preventDefault();
            camera.fov += event.deltaY * 0.05;
            camera.fov = Math.max(30, Math.min(100, camera.fov)); // Limites de zoom
            camera.updateProjectionMatrix();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
        }

        function update() {
            // 2. Autorotação lenta quando o usuário não estiver arrastando
            if (!arrastando) {
                lonAlvo += 0.05;
            }

            // 3. Suavização (Inércia) do movimento da câmera
            latAlvo = Math.max(-85, Math.min(85, latAlvo));
            lon += (lonAlvo - lon) * 0.1;
            lat += (latAlvo - lat) * 0.1;

            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const vetorAlvo = new THREE.Vector3();
            vetorAlvo.x = 500 * Math.sin(phi) * Math.sin(theta);
            vetorAlvo.y = 500 * Math.cos(phi);
            vetorAlvo.z = 500 * Math.sin(phi) * Math.cos(theta);

            camera.lookAt(vetorAlvo);
            renderizador.render(cena, camera);
        }
    </script>
</body>
</html>
