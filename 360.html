<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Paisagem 360°</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Importação corrigida (removido o .min duplicado) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let cena, camera, renderizador, esfera;
        let olhandoParaBaixo = false, noMouseX = 0, noMouseY = 0, lon = 0, lat = 0, phi = 0, theta = 0;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            cena = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

            const carregador = new THREE.TextureLoader();
            
            // Opção 1: Paisagem espacial (NASA / Wikimedia - Estável e pública)
            //const urlDaImagem = 'https://upload.wikimedia.org/wikipedia/commons/6/6f/Milky_Way_Arch_360_Ears.jpg';
            const urlDaImagem = './ceu.jpg';
            // Opção 2: Textura da Terra 360° (Wikimedia)
            // const urlDaImagem = 'https://upload.wikimedia.org/wikipedia/commons/8/83/Equirectangular_projection_SW.jpg'; 

            carregador.load(urlDaImagem, function (textura) {
                const geometria = new THREE.SphereGeometry(500, 60, 40);
                geometria.scale(-1, 1, 1);

                const material = new THREE.MeshBasicMaterial({ map: textura });

                esfera = new THREE.Mesh(geometria, material);
                cena.add(esfera);
            });

            renderizador = new THREE.WebGLRenderer();
            renderizador.setPixelRatio(window.devicePixelRatio);
            renderizador.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderizador.domElement);

            document.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            window.addEventListener('resize', onWindowResize);
        }

        function onPointerDown(event) {
            olhandoParaBaixo = true;
            noMouseX = event.clientX;
            noMouseY = event.clientY;
        }

        function onPointerMove(event) {
            if (olhandoParaBaixo === true) {
                lon = (noMouseX - event.clientX) * 0.1 + lon;
                lat = (event.clientY - noMouseY) * 0.1 + lat;
                lat = Math.max(-85, Math.min(85, lat));
                noMouseX = event.clientX;
                noMouseY = event.clientY;
            }
        }

        function onPointerUp() {
            olhandoParaBaixo = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
        }

        function update() {
            lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const vetorAlvo = new THREE.Vector3();
            vetorAlvo.x = 500 * Math.sin(phi) * Math.sin(theta);
            vetorAlvo.y = 500 * Math.cos(phi);
            vetorAlvo.z = 500 * Math.sin(phi) * Math.cos(theta);

            camera.lookAt(vetorAlvo);
            renderizador.render(cena, camera);
        }
    </script>
</body>
</html>
